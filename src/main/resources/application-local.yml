spring:
  ai:
    openai:
      # Spring AI appends /v1/chat/completions; avoid a duplicated /v1.
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: qwen/qwen3.8-27b
          temperature: 0.1
    mcp:
      client:
        enabled: false
        toolcallback:
          enabled: false

