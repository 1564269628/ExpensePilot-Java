# Local Groq profile. Base64 is encoding, NOT secret encryption.
# GitHub push protection blocks even Base64-encoded live API keys.
# On first use, set GROQ_API_KEY_BASE64 (or GROQ_API_KEY) locally.
spring:
  ai:
    openai:
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: qwen/qwen3.8-27b
          temperature: 0.1
    mcp:
      client:
        enabled: false

expensepilot:
  local:
    enabled: true
  groq:
    api-key-base64: ${GROQ_API_KEY_BASE64:}
