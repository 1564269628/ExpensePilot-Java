server:
  port: 8080

spring:
  application:
    name: expensepilot-java

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/expensepilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL}
          temperature: 0.1

    mcp:
      client:
        enabled: true
        name: expensepilot-production
        version: 1.0.0
        type: SYNC
        initialized: true
        request-timeout: 10s
        toolcallback:
          enabled: true

expensepilot:
  planner:
    zone-id: ${BUSINESS_ZONE_ID:Asia/Shanghai}
    max-attempts: 3
  tool:
    default-timeout-ms: 5000
  recovery:
    scan-delay-ms: 3000
    max-retry: 3
  pools:
    email: { core: 8, max: 16, queue: 100 }
    drive: { core: 8, max: 16, queue: 100 }
    travel: { core: 8, max: 16, queue: 100 }

  mcp:
    servers:
      email:
        url: ${EMAIL_MCP_URL}
        endpoint: ${EMAIL_MCP_ENDPOINT:/mcp}
        bearer-token: ${EMAIL_MCP_TOKEN:}
      drive:
        url: ${DRIVE_MCP_URL}
        endpoint: ${DRIVE_MCP_ENDPOINT:/mcp}
        bearer-token: ${DRIVE_MCP_TOKEN:}
      travel:
        url: ${TRAVEL_MCP_URL}
        endpoint: ${TRAVEL_MCP_ENDPOINT:/mcp}
        bearer-token: ${TRAVEL_MCP_TOKEN:}
      expense:
        url: ${EXPENSE_MCP_URL}
        endpoint: ${EXPENSE_MCP_ENDPOINT:/mcp}
        bearer-token: ${EXPENSE_MCP_TOKEN:}

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: expensepilot-producer
